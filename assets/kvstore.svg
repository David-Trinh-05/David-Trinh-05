<rect x="1" y="1" width="598" height="308" rx="14" fill="#0f1729" stroke="#1e2a44" stroke-width="2"/>
<rect x="1" y="1" width="6" height="308" rx="3" fill="#ffb347"/>
<text x="32" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#ffb347" letter-spacing="2">SYSTEMS · RUST</text>
<text x="32" y="80" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#e6edf3">mini-kv-store</text>
<text y="110" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#8b98ad"><tspan x="32" dy="0">Key-value store with a checksummed write-ahead log;</tspan><tspan x="32" dy="25">survives SIGKILL mid-batch and compacts the log.</tspan></text>
<line x1="32" y1="152" x2="568" y2="150" stroke="#1e2a44" stroke-width="1"/>
<text x="32" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#34d6b0">SIGKILL</text><text x="32" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8b98ad">recovered cleanly</text><text x="214" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">148 B</text><text x="214" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8b98ad">WAL after compaction</text><text x="396" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#e6edf3">CRC-32</text><text x="396" y="224" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#8b98ad">every frame</text>
